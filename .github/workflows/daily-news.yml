name: 每日新闻早报

on:
  # schedule:
   # - cron: '0 23 * * *'
  workflow_dispatch:


jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python send_news.py
